<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <img src="your-profile-image.jpg" alt="Your Name" class="profile-img" id="profileImg">
        <h1 class="name">Salem Iyabode</h1>
        <h2 class="title">Software Engineer</h2>

        <div class="contact-info">
            <p>Your short bio or contact information goes here</p>
        </div>
      
        <div class="button-container">
            <button class="btn btn-email" id="emailBtn">
                <i class="fas fa-envelope"></i> Email Me
            </button>
            <a href="https://www.linkedin.com/in/salem-iyabode" class="btn btn-linkedin" target="_blank" id="linkedinBtn">
                <i class="fab fa-linkedin-in"></i> LinkedIn
            </a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
